:root{
  --bg:#0a2e1f;
  --card:#143d2a;
  --white:#fff;
  --orange:#ff7a00;
  --ink:#0a2e1f;
  --mint:#dff6e9;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
*{
  box-sizing:border-box
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--bg);
  color:white;
  font-family:"Cairo","Tajawal",system-ui,sans-serif;
  line-height:2
}
button{
  font-family:inherit;
  cursor:pointer
}
a{
  color:inherit
}
.app-shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top)
}
.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:#071f15;
  border-bottom:4px solid var(--orange)
}
.header-inner{
  max-width:1280px;
  margin:auto;
  padding:18px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap
}
.brand-mark{
  background:var(--orange);
  color:#fff;
  border-radius:14px;
  padding:10px 14px;
  display:flex;
  gap:8px;
  align-items:center;
  font-weight:900
}
.brand-mark span{
  font-size:18px
}
.header-text{
  flex:1;
  min-width:280px
}
.header-text h1{
  font-size:34px;
  line-height:1.2;
  margin:0;
  font-weight:900
}
.header-text p{
  margin:6px 0 0;
  color:#cde8d8;
  font-size:20px;
  line-height:1.5
}
.header-text b{
  color:white
}
.header-text span{
  color:var(--orange)
}
.board-btn{
  background:white;
  color:var(--ink);
  border:0;
  border-radius:14px;
  padding:11px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
  font-size:19px
}
.board-btn small{
  background:#ffe6cc;
  color:#a64d00;
  padding:2px 8px;
  border-radius:99px
}
.ticker{
  max-width:1280px;
  margin:auto;
  padding:0 22px 11px;
  display:flex;
  gap:22px;
  color:#91c9a9;
  font-weight:800;
  font-size:16px;
  flex-wrap:wrap
}
main{
  max-width:1280px;
  margin:auto;
  padding:28px 22px 40px
}
.hero{
  background:white;
  color:var(--ink);
  border-radius:28px;
  padding:34px;
  overflow:hidden;
  position:relative
}
.hero:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:14px;
  height:100%;
  background:var(--orange)
}
.hero-copy{
  text-align:center;
  max-width:900px;
  margin:auto
}
.eyebrow{
  display:inline-flex;
  gap:8px;
  align-items:center;
  background:#fff0dd;
  color:#a64d00;
  padding:7px 14px;
  border-radius:99px;
  font-weight:900
}
.hero h2{
  font-size:56px;
  margin:14px 0 0;
  line-height:1.1
}
.api-big{
  color:var(--orange);
  font-size:72px
}
.en{
  font-size:22px;
  font-weight:800;
  color:#61756b;
  margin:2px
}
.lead{
  font-size:30px;
  font-weight:900;
  margin:6px
}
.highlight{
  background:var(--orange);
  color:white;
  border-radius:18px;
  padding:18px 22px;
  font-size:26px;
  font-weight:900;
  line-height:1.7;
  box-shadow:0 10px 0 #c65e00
}
.waiter-stage{
  display:grid;
  grid-template-columns:1fr 100px 1fr 100px 1fr;
  gap:10px;
  align-items:stretch;
  margin-top:26px
}
.waiter-card{
  border:3px solid #dce9df;
  border-radius:22px;
  padding:20px;
  text-align:center;
  background:#f7fbf8
}
.waiter-card.waiter{
  background:#fff7ec;
  border-color:var(--orange);
  transform:scale(1.04);
  box-shadow:0 12px 30px #ff7a0030
}
.mini-icon{
  width:62px;
  height:62px;
  border-radius:50%;
  background:var(--card);
  color:white;
  display:grid;
  place-items:center;
  margin:auto
}
.waiter-emoji{
  font-size:62px;
  line-height:1
}
.role{
  font-weight:900;
  color:#75887c
}
.role.orange{
  color:var(--orange)
}
.waiter-card h3{
  font-size:25px;
  margin:5px 0;
  line-height:1.3
}
.waiter-card p{
  margin:0;
  color:#5f7268;
  font-size:19px
}
.speech{
  background:var(--card);
  color:white;
  border-radius:14px;
  padding:9px;
  margin-top:13px;
  font-weight:900
}
.orange-speech{
  background:var(--orange)
}
.arrow-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#62776a;
  font-size:17px
}
.arrow{
  font-size:36px;
  color:var(--orange)
}
.hero-note{
  text-align:center;
  font-size:21px;
  font-weight:800;
  margin:22px 0 0
}
.section{
  margin-top:38px;
  background:var(--card);
  border-radius:28px;
  padding:28px
}
.section-head{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}
.section-head .num{
  background:var(--orange);
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
  flex:0 0 auto
}
.kicker{
  color:#ffb877;
  margin:0;
  font-weight:900
}
.section-head h2{
  margin:0;
  font-size:34px;
  line-height:1.3
}
.cta{
  margin-inline-start:auto;
  background:var(--orange);
  color:white;
  border:0;
  border-radius:13px;
  padding:12px 18px;
  font-weight:900;
  font-size:20px;
  display:flex;
  gap:8px;
  align-items:center
}
.weather-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:20px;
  margin-top:22px
}
.steps{
  display:flex;
  flex-direction:column;
  gap:10px
}
.step{
  background:#0a2e1f;
  border:2px solid #2b5a41;
  color:white;
  border-radius:16px;
  padding:13px 15px;
  display:flex;
  gap:12px;
  align-items:center;
  text-align:start;
  width:100%;
  transition:.2s
}
.step.done{
  border-color:var(--orange);
  background:#1d4b33
}
.step-n{
  background:#fff;
  color:var(--ink);
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:22px
}
.step b{
  display:block;
  font-size:20px;
  line-height:1.4
}
.step span{
  color:#b9d5c3
}
.check{
  margin-inline-start:auto;
  color:var(--orange)
}
.progress{
  height:10px;
  background:#0a2e1f;
  border-radius:99px;
  overflow:hidden
}
.progress span{
  display:block;
  height:100%;
  background:var(--orange);
  transition:.5s
}
.weather-card{
  background:white;
  color:var(--ink);
  border-radius:22px;
  padding:22px;
  text-align:center
}
.weather-top{
  display:flex;
  justify-content:space-between;
  font-weight:900
}
.live{
  color:#0f7a55
}
.sun-big{
  font-size:76px
}
.temp{
  font-size:68px;
  font-weight:900;
  line-height:1
}
.cond{
  font-size:26px;
  font-weight:900
}
.weather-line{
  background:#fff0dd;
  border-radius:12px;
  padding:10px;
  margin:14px 0;
  font-weight:900
}
.weather-search{
  display:flex;
  background:#eef4ef;
  border-radius:12px;
  padding:5px
}
.weather-search span{
  flex:1;
  padding:9px;
  font-weight:900
}
.weather-search button{
  background:var(--orange);
  color:white;
  border:0;
  border-radius:9px;
  padding:9px 18px;
  font-weight:900;
  font-size:18px
}
.why-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:22px
}
.white-card{
  background:white;
  color:var(--ink);
  border-radius:22px;
  padding:24px
}
.why h3{
  font-size:27px;
  margin:14px 0 4px
}
.why p{
  font-size:21px;
  margin:0;
  line-height:1.6
}
.why span{
  display:block;
  margin-top:12px;
  background:#eef4ef;
  border-radius:10px;
  padding:9px;
  font-weight:900;
  color:#315545
}
.icon-box{
  width:68px;
  height:68px;
  border-radius:16px;
  display:grid;
  place-items:center
}
.icon-box.green{
  background:#dff6e9;
  color:#0f7a55
}
.icon-box.orange{
  background:#fff0dd;
  color:var(--orange)
}
.icon-box.blue{
  background:#e0f3ff;
  color:#0b6f9e
}
.commands-section{
  background:#fff;
  color:var(--ink)
}
.commands-section .section-head{
  color:var(--ink)
}
.commands-section .kicker{
  color:#d96a00
}
.commands-section .num{
  color:white
}
.commands-section .hint{
  margin-inline-start:auto;
  background:#eef4ef;
  padding:8px 13px;
  border-radius:99px;
  font-weight:900
}
.command-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:22px
}
.cmd-tab{
  border:3px solid #e4ebe6;
  background:#f8faf8;
  border-radius:18px;
  padding:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  font-weight:900;
  color:var(--ink);
  font-size:21px
}
.cmd-tab.active{
  border-color:var(--c);
  background:white;
  box-shadow:0 8px 0 var(--c)
}
.cmd-id{
  font-size:30px;
  color:var(--c)
}
.cmd-tab small{
  color:#718479
}
.command-detail{
  margin-top:20px;
  border:3px solid #e7ede8;
  border-radius:22px;
  overflow:hidden
}
.detail-main{
  color:white;
  padding:22px;
  display:flex;
  gap:20px;
  align-items:center
}
.detail-icon{
  background:rgba(255,255,255,.2);
  width:84px;
  height:84px;
  border-radius:20px;
  display:grid;
  place-items:center
}
.detail-id{
  margin:0;
  opacity:.9
}
.detail-main h3{
  font-size:38px;
  margin:0;
  line-height:1.2
}
.detail-simile{
  margin:6px 0 0;
  font-weight:800
}
.detail-examples{
  display:grid;
  grid-template-columns:1fr 1fr
}
.detail-examples>div{
  padding:18px;
  border-inline-end:2px solid #e7ede8
}
.detail-examples span{
  display:block;
  color:#6a7d71;
  font-weight:900
}
.detail-examples b{
  font-size:23px
}
.order-sim{
  display:flex;
  align-items:center;
  gap:14px;
  background:#fff7ec;
  padding:16px 20px
}
.order-sim>div{
  flex:1
}
.order-sim span{
  color:#a64d00;
  font-weight:900
}
.order-sim p{
  margin:0;
  font-size:22px;
  font-weight:900
}
.waiter-mini{
  font-size:42px
}
.order-sim button{
  background:var(--ink);
  color:white;
  border:0;
  border-radius:11px;
  padding:10px 15px;
  font-weight:900
}
.table-wrap{
  overflow-x:auto;
  margin-top:20px;
  border-radius:16px;
  border:2px solid #e7ede8
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:640px
}
th{
  background:var(--ink);
  color:white;
  text-align:start;
  padding:14px;
  font-size:20px
}
td{
  padding:14px;
  border-bottom:1px solid #e7ede8;
  font-size:20px
}
tr.selected{
  background:#fff7ec
}
.tbl-id{
  display:block;
  font-size:24px
}
.summary{
  background:var(--orange);
  color:white;
  text-align:center;
  padding:16px;
  border-radius:16px;
  margin-top:18px;
  font-size:25px;
  font-weight:900
}
.story-timeline{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:22px
}
.story-card{
  background:#0a2e1f;
  border-radius:20px;
  padding:20px;
  position:relative
}
.story-n{
  position:absolute;
  inset-inline-start:14px;
  top:12px;
  color:#7fae96;
  font-weight:900
}
.story-method{
  display:inline-block;
  color:white;
  border-radius:99px;
  padding:4px 13px;
  font-size:19px
}
.story-card h3{
  font-size:24px;
  line-height:1.4;
  margin:12px 0 4px
}
.story-card p{
  color:#b9d5c3;
  margin:0
}
.story-foot{
  margin-top:16px;
  background:white;
  color:var(--ink);
  border-radius:16px;
  padding:14px 20px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  font-size:22px
}
.story-foot b{
  color:var(--orange)
}
.quiz{
  background:#f7f2e9;
  color:var(--ink)
}
.quiz .kicker{
  color:#d96a00
}
.quiz .num{
  color:white
}
.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}
.score-box{
  background:var(--ink);
  color:white;
  border-radius:16px;
  padding:12px 18px;
  min-width:180px
}
.score-box b{
  font-size:26px
}
.score-box span{
  display:block;
  color:#b9d5c3
}
.score-bar{
  height:8px;
  background:#36594a;
  border-radius:99px;
  overflow:hidden;
  margin-top:6px
}
.score-bar i{
  display:block;
  background:var(--orange);
  height:100%
}
.quiz-instruction{
  font-size:20px;
  margin:16px 0 0
}
.questions-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:18px
}
.q-card{
  background:white;
  border:3px solid #e7ded0;
  border-radius:20px;
  padding:20px
}
.q-top{
  display:flex;
  justify-content:space-between;
  font-weight:900
}
.q-top span:first-child{
  color:#b26a00
}
.correct{
  color:#0f7a55
}
.wrong{
  color:#c62828
}
.q-card h3{
  font-size:24px;
  line-height:1.5;
  margin:10px 0 14px
}
.options{
  display:grid;
  gap:8px
}
.opt{
  border:2px solid #e7ded0;
  background:#fffdf8;
  border-radius:13px;
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:start;
  font-size:20px;
  font-weight:800;
  color:var(--ink)
}
.opt span{
  background:#f1e9da;
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:0 0 auto
}
.opt.selected{
  border-color:var(--ink);
  background:#eef4ef
}
.opt.right{
  border-color:#0f7a55;
  background:#dff6e9
}
.opt.wrong-opt{
  border-color:#c62828;
  background:#ffe7e4
}
.opt.dim{
  opacity:.55
}
.reveal{
  width:100%;
  margin-top:14px;
  background:var(--ink);
  color:white;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:900;
  font-size:20px;
  display:flex;
  justify-content:center;
  gap:8px
}
.explain{
  margin-top:14px;
  background:#fff0dd;
  border-radius:13px;
  padding:14px
}
.explain .hide{
  background:transparent;
  border:0;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:900;
  margin-inline-start:auto;
  color:#6a4c2f
}
.explain p{
  margin:7px 0 0
}
.explain b{
  display:block;
  color:#7a3f00
}
.explain span{
  display:block;
  color:#4a3a2d;
  margin-top:5px
}
.final-score{
  background:var(--ink);
  color:white;
  border-radius:16px;
  padding:18px;
  text-align:center;
  margin-top:18px;
  font-size:22px
}
.closing{
  text-align:center;
  padding:38px 20px 10px;
  color:white
}
.closing h2{
  font-size:36px;
  margin:8px
}
.closing p{
  font-size:22px;
  font-weight:800
}
.closing-pill{
  display:inline-block;
  background:var(--orange);
  padding:13px 20px;
  border-radius:99px;
  font-weight:900;
  font-size:21px
}
footer{
  max-width:1280px;
  margin:auto;
  border-top:1px solid #2b5a41;
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px
}
.footer,footer b{
  font-size:22px
}
footer span{
  display:block;
  color:#a9c9b8
}
footer a{
  background:var(--orange);
  color:white;
  padding:10px 16px;
  border-radius:99px;
  text-decoration:none;
  font-weight:900;
  display:flex;
  gap:8px;
  align-items:center
}
.board-mode{
  font-size:28px
}
.board-mode .hero h2{
  font-size:64px
}
.board-mode .api-big{
  font-size:84px
}
.board-mode p,.board-mode li,.board-mode td,.board-mode th,.board-mode button,.board-mode .lead,.board-mode .why p{
  font-size:28px!important;
  line-height:1.7
}
.board-mode h2{
  font-size:42px!important
}
.board-mode h3{
  font-size:31px!important
}
.board-mode .highlight,.board-mode .summary{
  font-size:30px!important
}
@media(max-width:900px){
  .waiter-stage{
    grid-template-columns:1fr;
  }
  .arrow-col{
    transform:rotate(90deg);
    height:48px
  }
  .weather-grid,.why-grid,.story-timeline,.questions-grid{
    grid-template-columns:1fr
  }
  .command-tabs{
    grid-template-columns:1fr 1fr
  }
  .hero{
    padding:24px 18px
  }
  .hero h2{
    font-size:42px
  }
  .api-big{
    font-size:54px
  }
  .highlight,.lead{
    font-size:22px
  }
  .header-text h1{
    font-size:28px
  }
  .section{
    padding:20px 16px
  }
  .section-head h2{
    font-size:29px
  }
  .detail-main{
    flex-direction:column;
    text-align:center
  }
  .detail-examples{
    grid-template-columns:1fr
  }
  .detail-examples>div{
    border-inline-end:0;
    border-bottom:2px solid #e7ede8
  }
}
@media(max-width:520px){
  main{
    padding:18px 12px
  }
  .header-inner{
    padding:14px
  }
  .command-tabs{
    grid-template-columns:1fr
  }
  .cta{
    margin-inline-start:0;
    width:100%;
    justify-content:center
  }
  .board-btn{
    width:100%;
    justify-content:center
  }
  .ticker{
    gap:10px
  }
  .waiter-card.waiter{
    transform:none
  }
  .hero h2{
    font-size:36px
  }
  .temp{
    font-size:54px
  }
  table{
    min-width:560px
  }
  .story-foot{
    text-align:center
  }
}
